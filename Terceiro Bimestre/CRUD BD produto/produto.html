<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Produto</title>
    <link rel="stylesheet" href="produto.css">
</head>

<body onload="listar()">
    <!-- Cabeçalho Semântico -->
    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seu catálogo de Velas aromáticas de forma fácil e rápida.</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container-master">
        
        <div class="conteudo-principal">
            <!-- Seção do Formulário -->
            <section class="form-esquerda">
                <h2>Dados do Produtos</h2>
                
                <label for="inputId_produto">ID do Produto</label>
                <div class="linha-id">
                    <input type="text" name="inputId_produto" id="inputId_produto" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_produto">Nome do Produto</label>
                <input type="text" name="inputNome_produto" id="inputNome_produto">

                <label for="inputTamanho_produto">Tamanho</label>
                <input type="text" name="inputTamanho_produto" id="inputTamanho_produto">

                <label for="inputPeso">Peso</label>
                <input type="number" name="inputPeso" id="inputPeso">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <!-- Aside para o Cartaz (Conteúdo Lateral) -->
            <aside class="form-direita">
                <h2>Imagem do Produto</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgCartaz" src="http://localhost:3001/imagens/silhueta.png" alt="Imagem do Produto" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <!-- Seção da Listagem -->
        <section class="lista-Produto">
            <h3>Produtos Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>

    </main>

    <!-- Rodapé Semântico -->
    <footer>
        <p>&copy; 2026 Sistema CRUD Produtos. Todos os direitos reservados.</p>
    </footer>

    <script src="./produtoControle.js"></script>
</body>

</html>
